<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简序 · 桌面任务管理原型</title><style>
:root{font-family:Inter,'Microsoft YaHei',system-ui,sans-serif;color:#293448;background:#edf0f4;font-size:14px}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer}body{margin:0;padding:25px}.top{max-width:1230px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:19px;margin:0}.top p{font-size:12px;color:#778194;margin:5px 0}.tabs{display:flex;background:#fff;border:1px solid #e1e5ec;border-radius:12px;padding:4px;gap:3px}.tabs button,.ghost{border:0;background:transparent;padding:8px 13px;border-radius:9px;color:#707b8e}.tabs .active,.ghost:hover{background:#eaf1fb;color:#315f9b}.layout{max-width:1230px;margin:20px auto;display:grid;grid-template-columns:355px 1fr;gap:22px;align-items:start}.panel{background:#fff;border:1px solid #e1e5ec;border-radius:17px;box-shadow:0 10px 32px #293e5d0b}.floating{padding:16px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.head strong{font-size:15px}.iconbtn{border:0;background:transparent;padding:6px 8px;border-radius:7px;color:#66758a}.iconbtn:hover{background:#f0f3f8}.heading{display:flex;align-items:center;justify-content:space-between;margin:15px 0 5px;font-size:11px;letter-spacing:.04em;color:#7f8b9c}.heading:after{content:'';height:1px;background:#e7ebf0;flex:1;margin-left:11px;order:1}.heading button{order:2;background:transparent;color:#6a8cb5;border:0;padding:2px 0 2px 7px}.taskrow{display:flex;align-items:center;gap:9px;min-height:34px;border-radius:6px;padding:4px 2px}.taskrow:hover{background:#f5f7fa}.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--dot);border:2px solid var(--dot)}.dot.plan{background:transparent}.name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.name.done{color:#a6adba;text-decoration:line-through}.when{font-size:11px;color:#8b94a2;white-space:nowrap}.check{accent-color:#7995b6;width:15px;height:15px;cursor:pointer}.section-scroll{height:181px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d1d9e4 transparent}.bar{display:flex;gap:7px;align-items:center;margin-top:12px}.textin{border:1px solid #e0e5ed;border-radius:8px;padding:9px 10px;min-width:0;background:#fff;outline:0;width:100%}.textin:focus{border-color:#9ab9df}.primary{border:0;border-radius:9px;background:#557da9;color:white;padding:9px 13px;white-space:nowrap}.primary:hover{background:#456d98}.minor{font-size:11px;color:#8a94a3}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{text-align:center;font-size:11px;color:#8e96a3;padding:7px 0}.cell{height:43px;min-width:0;padding:5px 1px 3px;border:1px solid transparent;border-radius:8px;text-align:center;cursor:pointer;background:transparent}.cell:hover{background:#f3f6fb}.cell.selected{background:#edf3fb;border-color:#cbdcf1}.cell.today .daynum{color:#497baa;font-weight:750}.cell.empty{pointer-events:none}.daynum{font-size:12px}.marks{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:5px;height:8px}.marks .dot{height:5px;width:5px;flex-basis:5px;border-width:1px}.more{font-size:9px;color:#737e91}.date-items{border-top:1px solid #edf0f3;margin-top:14px;padding-top:7px;max-height:160px;overflow:auto}.manager{padding:16px;min-height:550px}.manager-body{display:grid;grid-template-columns:44% 56%;gap:12px}.subpanel{background:#f7f9fc;border:1px solid #edf0f5;border-radius:11px;padding:12px;min-width:0;min-height:460px}.manager-list{max-height:470px;overflow-y:auto}.manager .cell{height:38px}.manager .taskrow{cursor:grab}.detail{margin-top:12px;padding:12px;background:white;border:1px solid #e4e9f1;border-radius:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:#8992a0}.field input,.field select{padding:8px;border:1px solid #e0e5ed;border-radius:7px;min-width:0;background:white}.detail-actions{display:flex;gap:7px}.settings{display:grid;gap:10px;padding:12px;background:#f8f9fb;border-radius:10px;margin-top:12px}.settingrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:12px;color:#7b8797;line-height:1.7;margin-top:14px}.muted{color:#9da6b3}.drop{outline:2px dashed #80a7da;background:#e8f1fc}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263a53;color:#fff;padding:10px 18px;border-radius:9px;display:none;font-size:12px}.hidden{display:none!important}@media(max-width:940px){.layout{grid-template-columns:1fr}.floating{max-width:370px}.manager-body{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}@media(max-width:500px){body{padding:12px}.tabs button{padding:7px}.floating{max-width:none}}
</style></head><body><header class="top"><div><h1>简序 / UI Prototype v0.1</h1><p>单文件离线原型 · 自动本地保存 · 模拟桌面悬浮窗与完整管理窗口</p></div><div class="tabs"><button class="active" id="showBoth">全部界面</button><button id="showFloat">仅悬浮窗</button><button id="showManager">仅管理窗口</button></div></header><main class="layout" id="layout"><section class="panel floating" id="floating"><div class="head"><strong id="floatTitle">Tasks</strong><div><button class="iconbtn" id="switchView" title="切换列表/日历">▦</button><button class="iconbtn" id="gotoManager" title="管理窗口">▣</button><button class="iconbtn" id="floatingMode" title="切换普通/置顶模式">♧</button></div></div><div id="floatTasks"><div class="heading"><span>置顶</span><button id="expandPin"></button></div><div id="pinnedItems"></div><div class="heading"><span>Task</span><span id="taskCount" style="order:2"></span></div><div class="section-scroll" id="taskItems"></div><div class="heading"><span>计划</span><button id="expandPlan"></button></div><div id="planItems"></div><div class="bar"><input class="textin" id="quickList" placeholder="添加事项（默认无日期）"><button class="primary" id="listAdd">+</button></div></div><div id="floatCalendar" class="hidden"><div id="floatCal"></div><div class="date-items" id="floatDayItems"></div><div class="bar"><input class="textin" id="quickCal" placeholder="添加到选中日期"><button class="primary" id="calAdd">+</button></div></div><div class="hint" id="modeHint">悬浮模式：普通（演示；真正置顶需 Qt 实现）</div></section><section class="panel manager" id="manager"><div class="head"><strong>完整管理窗口</strong><div><button class="iconbtn" id="managerSettings">⚙ 设置</button><button class="iconbtn" id="resetData">↺ 重置示例</button></div></div><div class="manager-body" id="managerBody"><div class="subpanel"><div class="head"><strong>全部事项</strong><span class="minor">点击编辑 · 拖动改期</span></div><input class="textin" id="search" placeholder="搜索事项..."><div class="manager-list" id="managerList"></div><div class="bar"><input class="textin" id="managerQuick" placeholder="新建 Task"><button class="primary" id="managerAdd">+</button></div></div><div class="subpanel"><div id="managerCal"></div><div id="rightBottom"></div></div></div><div id="settings" class="settings hidden"><strong>设置</strong><div class="settingrow"><span>悬浮模式</span><select id="modeSelect"><option value="normal">普通悬浮</option><option value="top">始终置顶</option></select></div><div class="settingrow"><span>计划默认在日历显示</span><span class="minor">每个计划独立设置</span></div><p class="minor">演示页面无法控制操作系统窗口层级。最终版本通过 Qt WindowFlags 实现。</p><button class="primary" id="closeSettings">返回管理界面</button></div><div class="hint">右侧日历支持接收从左侧拖入的 Task；选中事项后在右侧详情编辑。实际 C++ Qt 程序将使用原生窗口和 SQLite。</div></section></main><div class="toast" id="toast"></div><script>
(()=>{'use strict';const KEY='light-task-prototype-v01';const today='2026-10-14';const sample=()=>({items:[{id:1,title:'每日英语学习',group:'study',type:'task',pinned:true,date:null,time:'20:00',done:false},{id:2,title:'研究记录整理',group:'study',type:'task',pinned:true,date:null,time:'',done:false},{id:3,title:'健身计划',group:'life',type:'plan',pinned:true,date:null,time:'',progress:1,target:3,showCalendar:false,done:false},{id:4,title:'参加组会',group:'project',type:'task',pinned:false,date:today,time:'14:00',timeKind:'start',done:false},{id:5,title:'提交实验报告',group:'study',type:'task',pinned:false,date:'2026-10-15',time:'18:00',timeKind:'due',done:false},{id:6,title:'修改实验代码',group:'study',type:'task',pinned:false,date:'2026-10-16',time:'',done:false},{id:7,title:'购买生活用品',group:'life',type:'task',pinned:false,date:'2026-10-19',time:'',done:false},{id:8,title:'整理笔记',group:'project',type:'task',pinned:false,date:null,time:'',done:false},{id:9,title:'备份服务器文件',group:'study',type:'task',pinned:false,date:null,time:'',done:false},{id:10,title:'每周阅读论文',group:'study',type:'plan',pinned:false,date:null,time:'',progress:1,target:2,showCalendar:false,done:false},{id:11,title:'每周运动',group:'life',type:'plan',pinned:false,date:'2026-10-16',time:'',progress:2,target:3,showCalendar:true,done:false},{id:12,title:'月度资料整理',group:'project',type:'plan',pinned:false,date:null,time:'',progress:0,target:1,showCalendar:false,done:false}],floatingMode:'normal'});let state;try{state=JSON.parse(localStorage.getItem(KEY))||sample()}catch(e){state=sample()}const colors={study:'#6b97c6',project:'#a68ac5',life:'#80a995',other:'#aaaeb8'};let view='tasks',pinExpand=false,planExpand=false,selectedDay=today,calYear=2026,calMonth=9,selectedItem=5,settingOpen=false;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=msg=>{const e=$('toast');e.textContent=msg;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',1800)};const color=i=>colors[i.group]||colors.other;const sortTasks=(a,b)=>{const aDate=a.date||'9999-99-99',bDate=b.date||'9999-99-99';return aDate.localeCompare(bDate)||String(a.time||'').localeCompare(String(b.time||''))||a.id-b.id};function row(i,draggable=false){const mark=i.type==='plan'?`${i.progress||0}/${i.target||1}`:(i.date?i.date.slice(5)+(i.time?' '+i.time:''):(i.time||'—'));return `<div class="taskrow" ${draggable?`draggable="true" data-drag="${i.id}"`:''}><span class="dot ${i.type==='plan'?'plan':''}" style="--dot:${color(i)}"></span><span class="name ${i.done?'done':''}" data-edit="${i.id}" title="点击编辑">${esc(i.title)}</span><span class="when">${esc(mark)}</span><input aria-label="完成" type="checkbox" class="check" data-done="${i.id}" ${i.done?'checked':''}></div>`}function renderTasks(){const pin=state.items.filter(i=>i.pinned&&!i.done),tasks=state.items.filter(i=>!i.pinned&&i.type==='task'&&!i.done).sort(sortTasks),plans=state.items.filter(i=>!i.pinned&&i.type==='plan'&&!i.done);$('pinnedItems').innerHTML=(pinExpand?pin:pin.slice(0,2)).map(i=>row(i)).join('')||'<div class="minor">无置顶事项</div>';$('planItems').innerHTML=(planExpand?plans:plans.slice(0,2)).map(i=>row(i)).join('')||'<div class="minor">无计划</div>';$('taskItems').innerHTML=tasks.map(i=>row(i)).join('')||'<div class="minor">暂无待办事项</div>';$('expandPin').textContent=pin.length>2?(pinExpand?'收起':`+${pin.length-2}`):'';$('expandPlan').textContent=plans.length>2?(planExpand?'收起':`+${plans.length-2}`):'';$('taskCount').textContent=tasks.length+' 项'}function sameMonth(i,y,m){return i.date&&i.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)&&(i.type==='task'||i.showCalendar)}const itemsOnDay=d=>state.items.filter(i=>i.date===d&&(i.type==='task'||i.showCalendar));function calHTML(){const first=(new Date(calYear,calMonth,1).getDay()+6)%7,days=new Date(calYear,calMonth+1,0).getDate(),len=Math.ceil((first+days)/7)*7;let out=`<div class="calendar-head"><strong>${calYear}年${calMonth+1}月</strong><span><button class="iconbtn" data-month="-1">‹</button><button class="iconbtn" data-today="1">今天</button><button class="iconbtn" data-month="1">›</button></span></div><div class="calgrid">${['一','二','三','四','五','六','日'].map(d=>`<div class="weekday">${d}</div>`).join('')}`;for(let i=0;i<len;i++){const day=i-first+1;if(day<1||day>days){out+='<div class="cell empty"></div>';continue}const d=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,items=itemsOnDay(d),dots=items.length>3?items.slice(0,2):items;out+=`<div class="cell ${d===selectedDay?'selected':''} ${d===today?'today':''}" data-date="${d}"><div class="daynum">${day}</div><div class="marks">${dots.map(x=>`<span class="dot ${x.type==='plan'?'plan':''}" style="--dot:${color(x)}"></span>`).join('')}${items.length>3?`<span class="more">+${items.length-2}</span>`:''}</div></div>`}return out+'</div>'}function renderCalendars(){$('floatCal').innerHTML=calHTML();$('managerCal').innerHTML=calHTML();let day=itemsOnDay(selectedDay);$('floatDayItems').innerHTML=`<div class="heading"><span>${selectedDay} · ${day.length} 项</span></div>`+(day.map(i=>row(i)).join('')||'<div class="minor">该日没有事项</div>');renderRight()}function renderManager(){const query=$('search').value.trim().toLowerCase();let groups=[['置顶',state.items.filter(i=>i.pinned)],['Task',state.items.filter(i=>!i.pinned&&i.type==='task').sort(sortTasks)],['计划',state.items.filter(i=>!i.pinned&&i.type==='plan')]];$('managerList').innerHTML=groups.map(([title,items])=>`<div class="heading"><span>${title}</span></div>`+items.filter(i=>i.title.toLowerCase().includes(query)).map(i=>row(i,true)).join('')).join('');renderRight()}function renderRight(){let i=state.items.find(x=>x.id===selectedItem);$('rightBottom').innerHTML=i?`<div class="detail"><div class="head"><strong>事项详情</strong><button class="iconbtn" data-close-detail="1">✕</button></div><div class="field"><label>名称</label><input data-field="title" value="${esc(i.title)}"></div><div class="field"><label>日期</label><input data-field="date" type="date" value="${esc(i.date||'')}"></div><div class="field"><label>时间</label><input data-field="time" type="time" value="${esc(i.time||'')}"></div><div class="field"><label>任务组</label><select data-field="group">${[['study','学习研究'],['project','项目'],['life','生活'],['other','其他']].map(([v,t])=>`<option ${v===i.group?'selected':''} value="${v}">${t}</option>`).join('')}</select></div>${i.type==='plan'?`<label class="minor"><input type="checkbox" data-field="showCalendar" ${i.showCalendar?'checked':''}> 在日历中显示</label><div class="minor" style="margin-top:5px">需要填写具体日期才能出现日历标记</div>`:''}<div class="detail-actions" style="margin-top:12px"><button class="primary" id="saveDetail">保存修改</button><button class="ghost" data-pin="${i.id}">${i.pinned?'取消置顶':'置顶'}</button><button class="ghost" data-delete="${i.id}">删除</button></div></div>`:`<div class="date-items"><strong>${selectedDay}</strong>${itemsOnDay(selectedDay).map(i=>row(i)).join('')||'<p class="minor">点击左侧事项进入详情</p>'}</div>`}function renderAll(){renderTasks();renderCalendars();renderManager();$('modeHint').textContent='悬浮模式：'+(state.floatingMode==='top'?'始终置顶':'普通悬浮')+'（浏览器内仅作设置演示）';$('modeSelect').value=state.floatingMode;save()}function add(title,date=null){title=title.trim();if(!title)return;state.items.push({id:Math.max(0,...state.items.map(x=>x.id))+1,title,group:'other',type:'task',pinned:false,date,time:'',timeKind:'due',done:false});renderAll();toast('已添加事项')}function updateMonth(delta){const x=new Date(calYear,calMonth+delta,1);calYear=x.getFullYear();calMonth=x.getMonth();renderCalendars()}function setDisplay(kind){$('floating').classList.toggle('hidden',kind==='manager');$('manager').classList.toggle('hidden',kind==='float');$('layout').style.gridTemplateColumns=kind==='float'?'355px':kind==='manager'?'1fr':'355px 1fr';['showBoth','showFloat','showManager'].forEach(id=>$(id).classList.toggle('active',id===({both:'showBoth',float:'showFloat',manager:'showManager'}[kind])))}document.addEventListener('click',e=>{const t=e.target.closest('[data-date],[data-month],[data-today],[data-edit],[data-pin],[data-delete],[data-close-detail]');if(!t)return;if(t.dataset.date){selectedDay=t.dataset.date;selectedItem=null;renderCalendars()}else if(t.dataset.month)updateMonth(Number(t.dataset.month));else if(t.dataset.today){calYear=2026;calMonth=9;selectedDay=today;renderCalendars()}else if(t.dataset.edit){selectedItem=Number(t.dataset.edit);setDisplay('both');renderRight()}else if(t.dataset.pin){const i=state.items.find(x=>x.id==t.dataset.pin);i.pinned=!i.pinned;renderAll()}else if(t.dataset.delete){state.items=state.items.filter(i=>i.id!=t.dataset.delete);selectedItem=null;renderAll()}else if(t.dataset.closeDetail){selectedItem=null;renderRight()}});document.addEventListener('change',e=>{if(e.target.dataset.done){const i=state.items.find(x=>x.id==e.target.dataset.done);if(i.type==='plan'){i.progress=(i.progress||0)+1;if(i.progress>=i.target)i.progress=0;toast('已记录一次计划完成')}else{i.done=e.target.checked}renderAll()}});document.addEventListener('click',e=>{if(e.target.id==='saveDetail'){const i=state.items.find(x=>x.id===selectedItem);if(!i)return;document.querySelectorAll('#rightBottom [data-field]').forEach(field=>{const key=field.dataset.field;i[key]=field.type==='checkbox'?field.checked:field.value;if(key==='date'&&!field.value)i[key]=null});renderAll();toast('已保存')}});$('expandPin').onclick=()=>{pinExpand=!pinExpand;renderTasks()};$('expandPlan').onclick=()=>{planExpand=!planExpand;renderTasks()};$('switchView').onclick=()=>{view=view==='tasks'?'calendar':'tasks';$('floatTasks').classList.toggle('hidden',view!=='tasks');$('floatCalendar').classList.toggle('hidden',view!=='calendar');$('floatTitle').textContent=view==='tasks'?'Tasks':'Calendar';$('switchView').textContent=view==='tasks'?'▦':'☷'};$('listAdd').onclick=()=>{add($('quickList').value);$('quickList').value=''};$('calAdd').onclick=()=>{add($('quickCal').value,selectedDay);$('quickCal').value=''};$('managerAdd').onclick=()=>{add($('managerQuick').value);$('managerQuick').value=''};[['quickList','listAdd'],['quickCal','calAdd'],['managerQuick','managerAdd']].forEach(([a,b])=>$(a).addEventListener('keydown',e=>{if(e.key==='Enter')$(b).click()}));$('search').oninput=renderManager;$('gotoManager').onclick=()=>setDisplay('manager');$('floatingMode').onclick=()=>{state.floatingMode=state.floatingMode==='top'?'normal':'top';renderAll()};$('modeSelect').onchange=e=>{state.floatingMode=e.target.value;renderAll()};$('managerSettings').onclick=()=>{$('managerBody').classList.toggle('hidden');$('settings').classList.toggle('hidden')};$('closeSettings').onclick=()=>{$('managerBody').classList.remove('hidden');$('settings').classList.add('hidden')};$('resetData').onclick=()=>{if(confirm('恢复原始演示数据？')){state=sample();renderAll()}};$('showBoth').onclick=()=>setDisplay('both');$('showFloat').onclick=()=>setDisplay('float');$('showManager').onclick=()=>setDisplay('manager');document.addEventListener('dragstart',e=>{let t=e.target.closest('[data-drag]');if(t&&e.dataTransfer){e.dataTransfer.setData('text/plain',t.dataset.drag);e.dataTransfer.effectAllowed='move'}});document.addEventListener('dragover',e=>{let t=e.target.closest('#managerCal [data-date]');if(t){e.preventDefault();t.classList.add('drop')}});document.addEventListener('dragleave',e=>{if(e.target.classList)e.target.classList.remove('drop')});document.addEventListener('drop',e=>{let t=e.target.closest('#managerCal [data-date]');if(t){e.preventDefault();const i=state.items.find(x=>x.id===Number(e.dataTransfer.getData('text/plain')));if(i){i.date=t.dataset.date;selectedDay=i.date;renderAll();toast('已调整事项日期')}}});renderAll()})();
</script></body></html>
